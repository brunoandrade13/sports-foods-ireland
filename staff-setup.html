<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Device Setup — SFI</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 420px; width: 100%; text-align: center; }
  .logo { font-size: 14px; color: #64748b; margin-bottom: 32px; letter-spacing: 2px; text-transform: uppercase; }
  .status { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .status.active { background: #14532d; color: #4ade80; }
  .status.inactive { background: #1e3a5f; color: #60a5fa; }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }
  .device-info { background: #0f172a; border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; font-size: 0.8rem; color: #64748b; text-align: left; }
  .device-info span { color: #94a3b8; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; text-decoration: none; }
  .btn:hover { opacity: 0.9; }
  .btn-enable { background: #4ade80; color: #052e16; margin-bottom: 10px; }
  .btn-disable { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
  .note { font-size: 0.75rem; color: #475569; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Sports Foods Ireland</div>
  <div class="status" id="statusIcon"></div>
  <h1 id="statusTitle"></h1>
  <p id="statusDesc"></p>
  <div class="device-info">
    <div>Dispositivo: <span id="deviceType"></span></div>
    <div>Browser: <span id="browserName"></span></div>
    <div>Status GA4: <span id="gaStatus"></span></div>
  </div>
  <button class="btn btn-enable" id="btnEnable" onclick="enableInternal()">Marcar este dispositivo como Staff</button>
  <button class="btn btn-disable" id="btnDisable" onclick="disableInternal()">Remover — voltar a ser visitante normal</button>
  <p class="note">Esta configuração fica guardada neste browser. Se usares browser diferente ou modo privado, precisas repetir.</p>
</div>

<script>
function isInternal() {
  return localStorage.getItem('sfi_internal_user') === '1';
}

function getDevice() {
  var ua = navigator.userAgent;
  var type = window.innerWidth < 768 ? 'Mobile' : 'Desktop';
  var browser = ua.includes('Chrome') && !ua.includes('Edg') ? 'Chrome' :
                ua.includes('Firefox') ? 'Firefox' :
                ua.includes('Safari') && !ua.includes('Chrome') ? 'Safari' :
                ua.includes('Edg') ? 'Edge' : 'Other';
  return { type: type, browser: browser };
}

function updateUI() {
  var internal = isInternal();
  var device = getDevice();
  
  document.getElementById('statusIcon').textContent = internal ? '✓' : '○';
  document.getElementById('statusIcon').className = 'status ' + (internal ? 'active' : 'inactive');
  document.getElementById('statusTitle').textContent = internal ? 'Dispositivo Staff Ativo' : 'Dispositivo não marcado';
  document.getElementById('statusDesc').textContent = internal
    ? 'As tuas visitas a este site não aparecem nos relatórios de GA4 nem no Supabase analytics. Os dados estão limpos.'
    : 'As tuas visitas estão a ser contadas como tráfego real. Marca este dispositivo para os excluir dos relatórios.';
  
  document.getElementById('deviceType').textContent = device.type;
  document.getElementById('browserName').textContent = device.browser;
  document.getElementById('gaStatus').textContent = internal ? 'Excluído (traffic_type=internal)' : 'A ser contado';
  
  document.getElementById('btnEnable').style.display = internal ? 'none' : 'block';
  document.getElementById('btnDisable').style.display = internal ? 'block' : 'none';
}

function enableInternal() {
  localStorage.setItem('sfi_internal_user', '1');
  if (typeof gtag === 'function') gtag('set', { 'traffic_type': 'internal' });
  updateUI();
  setTimeout(function() {
    document.getElementById('statusDesc').textContent = 'Perfeito! Este dispositivo está agora excluído dos relatórios. Podes fechar esta página.';
  }, 300);
}

function disableInternal() {
  localStorage.removeItem('sfi_internal_user');
  updateUI();
}

updateUI();
</script>
</body>
</html>
